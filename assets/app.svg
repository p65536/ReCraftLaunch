<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- 背景グラデーション -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22272e" />
      <stop offset="100%" stop-color="#14171c" />
    </linearGradient>

    <!-- キートップ（上面）グラデーション -->
    <linearGradient id="keyTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <!-- プロンプト（シアン〜セルリアン） -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- コンソール領域の背景グラデーション -->
    <linearGradient id="consoleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1217" />
      <stop offset="100%" stop-color="#181c24" />
    </linearGradient>
  </defs>

  <!-- ウィンドウ外枠ベースプレート -->
  <rect x="16" y="16" width="224" height="224" rx="44" fill="url(#bgGrad)" stroke="#3e4451" stroke-width="6" />

  <!-- ================= 上部：キーボード領域 (Y: 34〜130) ================= -->
  <!-- 左キー：Ctrl (^) -->
  <g id="key-ctrl">
    <!-- キーベース（側面の立体影） -->
    <rect x="36" y="38" width="86" height="88" rx="18" fill="#111827" />
    <!-- キートップ（上面プレート） -->
    <rect x="36" y="34" width="86" height="84" rx="18" fill="url(#keyTopGrad)" stroke="#4b5563" stroke-width="2.5" />
    <!-- 印字：^ シンボル -->
    <path d="M 61 80 L 79 58 L 97 80" fill="none" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 右キー：Shift (⇧) -->
  <g id="key-shift">
    <!-- キーベース（側面の立体影） -->
    <rect x="134" y="38" width="86" height="88" rx="18" fill="#111827" />
    <!-- キートップ（上面プレート） -->
    <rect x="134" y="34" width="86" height="84" rx="18" fill="url(#keyTopGrad)" stroke="#4b5563" stroke-width="2.5" />
    <!-- 印字：⇧ シンボル -->
    <path d="M 177 56 L 157 76 H 167 V 94 H 187 V 76 H 197 Z" fill="#38BDF8" stroke="#38BDF8" stroke-width="2" stroke-linejoin="round" />
  </g>

  <!-- ================= 下部：コンソール領域 (Y: 144〜224) ================= -->
  <!-- コンソール入力行のベースプレート（凹みトレイ） -->
  <rect x="36" y="146" width="184" height="74" rx="18" fill="url(#consoleBg)" stroke="#2d333b" stroke-width="3" />

  <!-- プロンプト記号「>」 -->
  <path d="M 64 165 L 88 183 L 64 201" fill="none" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- コマンド入力カーソル「_」 -->
  <line x1="108" y1="201" x2="148" y2="201" stroke="#F3F4F6" stroke-width="12" stroke-linecap="round" />
</svg>